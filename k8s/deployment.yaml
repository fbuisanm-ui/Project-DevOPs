
apiVersion: apps/v1
kind: Deployment

metadata:
  name: project-devops
  labels:
    app: project-devops

spec:
  replicas: 2

  selector:
    matchLabels:
      app: project-devops

  template:
    metadata:
      labels:
        app: project-devops

    spec:
      containers:
        - name: project-devops
          image: project-devops:1.0
          imagePullPolicy: Never

          ports:
            - name: http
              containerPort: 8090

          readinessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 3
            periodSeconds: 5

          livenessProbe:
            httpGet:
              path: /health
              port: 8090
            initialDelaySeconds: 10
            periodSeconds: 10
